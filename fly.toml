# Fly.io configuration. See docs/DEPLOY.md for the one-time setup.
#
# IMPORTANT: run exactly ONE machine. The database is a SQLite file on a single
# volume, and a volume can only be attached to one machine.

app = "in-form"            # must be globally unique: change it (fly launch will offer a name)
primary_region = "syd"     # closest region to New Zealand

[build]

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  DATABASE_PATH = "/data/inform.db"
  # Behind Fly's proxy: real client IPs for rate limits, and Secure cookies.
  TRUST_PROXY = "true"
  # INFORM_PASSWORD is a secret, not set here: `fly secrets set INFORM_PASSWORD=...`

[mounts]
  source = "inform_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
