name: Test (and optional Fly.io deploy)

# Every push to main and every pull request runs the tests.
#
# Deploying to Fly.io is OFF by default: IN-FORM is a downloadable app and there is no
# hosted copy yet, so a deploy on every push would just fail (no FLY_API_TOKEN) and put
# a red cross on main. When a hosted copy exists, add the FLY_API_TOKEN secret (see
# docs/DEPLOY.md) and run this workflow by hand: Actions > Test (and optional Fly.io
# deploy) > Run workflow, on main. To deploy on every push again, change the deploy
# job's `if:` back to `github.ref == 'refs/heads/main' && github.event_name != 'pull_request'`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
