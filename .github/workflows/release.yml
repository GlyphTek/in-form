# Builds the portable Windows package and attaches it to a GitHub Release.
#
#   git tag v0.2.0 && git push origin v0.2.0      publishes a release
#   Actions > Release > Run workflow              builds the zip only (no release)
#
# NOT YET RUN: the first run will show whether the pieces fit together.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm test

      - name: Build the Windows package
        run: node scripts/package-win.mjs

      # node.exe came from npm; check it is byte-for-byte the official one.
      - name: Check node.exe against nodejs.org
        run: |
          VERSION=$(node -e 'import("./scripts/package-win.mjs").then(m => console.log(m.NODE_VERSION))')
          EXPECTED=$(curl -fsSL "https://nodejs.org/dist/v${VERSION}/SHASUMS256.txt" | grep ' win-x64/node.exe$' | cut -d' ' -f1)
          ACTUAL=$(sha256sum dist/*/node.exe | cut -d' ' -f1)
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL"

      - name: Checksum
        run: cd dist && sha256sum in-form-*-win-x64.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: in-form-win-x64
          path: |
            dist/in-form-*-win-x64.zip
            dist/SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/in-form-*-win-x64.zip dist/SHA256SUMS.txt \
            --title "IN-FORM ${GITHUB_REF_NAME}" \
            --notes "Windows (portable): download the zip, extract it, double-click start.bat. Not code-signed, so Windows may warn; see README.txt inside the zip. SHA-256 of the zip is in SHA256SUMS.txt."
